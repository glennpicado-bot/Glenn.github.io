.vault:before{content:"";position:absolute;inset:12px;border:1px solid #b19a6a45;border-radius:8px;pointer-events:none}
header{text-align:center;margin-bottom:25px;position:relative} .eyebrow{text-transform:uppercase;letter-spacing:.24em;font:600 10px/1.4 system-ui,sans-serif;color:#c3a978}.sigil{font-size:22px;color:var(--gold);text-shadow:0 0 14px #edc87199;margin-bottom:7px}h1{font-weight:400;letter-spacing:.08em;font-size:clamp(27px,7vw,35px);margin:0 0 7px;text-shadow:0 2px 8px #0008}.intro{margin:0;color:#c2b49d;font-size:14px;letter-spacing:.02em}

.controls{display:flex;justify-content:center;align-items:center;gap:12px;margin:18px 0 0}.control{border:0;background:transparent;color:#c1b29c;padding:8px 12px;font:11px system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}.control:hover{color:#f0dba8}.status{text-align:center;min-height:26px;margin:15px 0 0;color:#c5b798;font-size:13px;letter-spacing:.02em}.status.good{color:#a8edbb;text-shadow:0 0 12px #57e983}.status.bad{color:#ffaaa4;text-shadow:0 0 12px #ed4747}.rune.good{color:#9effbb;border-color:#75e49a;box-shadow:0 0 24px #3ef276a8,inset 0 0 22px #39ed763d}.rune.bad{color:#ff9292;border-color:#ff6666;box-shadow:0 0 24px #f33a52a8,inset 0 0 22px #f33a523d}.footer{margin-top:25px;text-align:center;color:#897f70;font:10px system-ui,sans-serif;letter-spacing:.08em}.glyph-label{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.veil{position:fixed;inset:0;background:#06050bee;display:none;place-items:center;padding:20px;z-index:5}.veil.open{display:grid}.dialog{position:relative;width:min(100%,760px);padding:15px;border:1px solid #b99a61;border-radius:10px;background:linear-gradient(145deg,#332d32,#15141a);box-shadow:0 25px 90px #000}.dialog video{display:block;width:100%;max-height:75vh;background:#050505;border-radius:5px}.close{position:absolute;right:10px;top:10px;z-index:1;width:35px;height:35px;border-radius:50%;border:1px solid #c8ac6d;background:#17151c;color:#f8e8c1;font:22px Georgia;cursor:pointer}.video-error{text-align:center;color:#ffaaa4;margin:10px 0 0;font:13px system-ui,sans-serif}.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}.poof{position:fixed;inset:0;z-index:4;pointer-events:none;overflow:hidden}.confetti{position:absolute;width:8px;height:13px;border-radius:2px;animation:fall 1.5s ease-out forwards}@keyframes fall{0%{transform:translate(0,-20px) rotate(0);opacity:1}100%{transform:translate(var(--dx),105vh) rotate(720deg);opacity:0}}

let videoObjectUrl=null;
let entered=[];let locked=false;
const keypad=document.querySelector('#keypad'), screen=document.querySelector('#screen'), status=document.querySelector('#status');
const starfield=document.querySelector('#starfield');
for(let i=0;i<105;i++){
 const star=document.createElement('i');star.className='star';
 const duration=22+Math.random()*34;
 star.style.left=(Math.random()*100)+'%';star.style.top=(Math.random()*100)+'%';
 star.style.setProperty('--duration',duration.toFixed(1)+'s');
 star.style.setProperty('--delay',(-Math.random()*duration).toFixed(1)+'s');
 star.style.setProperty('--sparkle',(0.7+Math.random()*1.6).toFixed(1)+'s');
 star.style.setProperty('--dx',(260+Math.random()*680).toFixed(0)+'px');
 star.style.setProperty('--dy',(Math.random()*240-120).toFixed(0)+'px');
 star.style.setProperty('--bright',(0.45+Math.random()*0.55).toFixed(2));
 starfield.appendChild(star);
}
glyphs.forEach((glyph,i)=>{const b=document.createElement('button');b.className='rune';b.type='button';b.setAttribute('aria-label',labels[i]+' rune');b.innerHTML='<span class="rune-glyph">'+glyph+'</span><span class="glyph-label"> '+labels[i]+'</span>'; b.addEventListener('click',()=>press(i));keypad.appendChild(b)});
function draw(){screen.innerHTML='';for(let i=0;i<4;i++){const s=document.createElement('span');s.className='slot'+(entered[i]===undefined?' empty':'');s.textContent=entered[i]===undefined?'·':glyphs[entered[i]];s.setAttribute('aria-label',entered[i]===undefined?'Empty rune':labels[entered[i]]);screen.appendChild(s)}}
function setStatus(text,kind=''){status.textContent=text;status.className='status'+(kind?' '+kind:'')}
function press(i){if(locked)return;entered.push(i);draw();if(entered.length===4)unlock()}
function unlock(){locked=true;const buttons=[...keypad.children];let kind='',message='';if(equal(entered,visionCode)){playVision();entered=[];draw();setStatus('')}else if(equal(entered,answer)){kind='good';message='Code accepted.';buttons.forEach(b=>b.classList.add('good'));setStatus(message,'good');confetti()}else{kind='bad';message='Code rejected. Try again.';buttons.forEach(b=>b.classList.add('bad'));setStatus(message,'bad');document.querySelector('.vault').classList.add('shake')}
if(kind==='bad'){setTimeout(()=>{entered=[];draw();buttons.forEach(b=>b.classList.remove('bad'));document.querySelector('.vault').classList.remove('shake');setStatus('');locked=false},950)}else if(kind==='good'){setTimeout(()=>{buttons.forEach(b=>b.classList.remove('good'));locked=false;setStatus('Code accepted.')},2100)}else{locked=false}}
function equal(a,b){return a.length===b.length&&a.every((v,i)=>v===b[i])}
document.querySelector('#undo').addEventListener('click',()=>{if(locked)return;entered.pop();draw();setStatus('')});document.querySelector('#clear').addEventListener('click',()=>{if(locked)return;entered=[];draw();setStatus('')});
function confetti(){const p=document.querySelector('#poof');p.innerHTML='';const colors=['#fff0a6','#88f2ad','#d4a7ff','#f8c877','#89dfff'];for(let i=0;i<100;i++){const c=document.createElement('i');c.className='confetti';c.style.left=(Math.random()*100)+'%';c.style.top=(Math.random()*12-10)+'%';c.style.background=colors[i%colors.length];c.style.setProperty('--dx',(Math.random()*180-90)+'px');c.style.animationDelay=(Math.random()*.28)+'s';p.appendChild(c)}setTimeout(()=>p.innerHTML='',2300)}
function playVision(){const v=document.querySelector('#vision');const veil=document.querySelector('#veil');const error=document.querySelector('#videoError');error.hidden=true;let fallbackTried=false;v.onerror=()=>{if(!fallbackTried){fallbackTried=true;v.src='data:video/mp4;base64,'+embeddedVideoBase64;v.load();v.play().catch(()=>{})}else{error.hidden=false}};const raw=atob(embeddedVideoBase64);const bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);if(videoObjectUrl)URL.revokeObjectURL(videoObjectUrl);videoObjectUrl=URL.createObjectURL(new Blob([bytes],{type:'video/mp4'}));v.src=videoObjectUrl;v.load();veil.classList.add('open');v.play().catch(()=>{});document.querySelector('#close').focus()}
function closeVision(){const v=document.querySelector('#vision');v.pause();v.onerror=null;v.removeAttribute('src');v.load();if(videoObjectUrl){URL.revokeObjectURL(videoObjectUrl);videoObjectUrl=null}document.querySelector('#veil').classList.remove('open');document.querySelector('#videoError').hidden=true;setStatus('')}
document.querySelector('#close').addEventListener('click',closeVision);document.querySelector('#veil').addEventListener('click',e=>{if(e.target.id==='veil')closeVision()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('#veil').classList.contains('open'))closeVision()});
draw();
</script>
